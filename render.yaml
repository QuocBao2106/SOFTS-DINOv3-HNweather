services:
  - type: web
    name: hanoi-weather-ai
    runtime: python
    plan: free
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 && pip install -r requirements-web.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MODEL_DIR
        value: checkpoints/HanoiWeather_SOFTS_FINAL_168_24
