
name: HanoiWeather CI

# Chạy kiểm tra khi có commit mới hoặc Pull Request
on:
  push:
    branches:
      - experiment/softs-dinov3-encoder

  pull_request:
    branches:
      - experiment/softs-dinov3-encoder

  workflow_dispatch:

# Chỉ cấp quyền đọc repository
permissions:
  contents: read

jobs:
  validate:
    name: Validate HanoiWeather
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn từ GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Thiết lập Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-web.txt

      # 3. Cài các thư viện của website
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt

      # 4. Kiểm tra cú pháp Python
      - name: Check Python syntax
        run: |
          python -m compileall -q app.py models layers utils

      # 5. Kiểm tra checkpoint, scaler và config
      - name: Validate SOFTS artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import joblib

          folder = Path(
              "checkpoints/HanoiWeather_SOFTS_FINAL_168_24"
          )

          required = [
              "checkpoint.pth",
              "scaler.pkl",
              "config.json"
          ]

          for name in required:
              path = folder / name
              assert path.is_file(), f"Missing file: {path}"
              assert path.stat().st_size > 0, f"Empty file: {path}"

          with open(folder / "config.json", encoding="utf-8") as f:
              config = json.load(f)

          expected_features = [
              "temperature_2m",
              "relative_humidity_2m",
              "precipitation",
              "wind_speed_10m",
              "cloud_cover"
          ]

          assert config["model"] == "SOFTS"
          assert config["seq_len"] == 168
          assert config["pred_len"] == 24
          assert config["features"] == expected_features

          scaler = joblib.load(folder / "scaler.pkl")

          assert scaler.n_features_in_ == 5

          if hasattr(scaler, "feature_names_in_"):
              assert list(scaler.feature_names_in_) == expected_features

          print("SOFTS artifacts: VALID")
          print("Input: 168 hours x 5 features")
          print("Output: 24 hours x 5 features")
          PY

      # 6. Kiểm tra giao diện
      - name: Validate website frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("static/index.html")
          assert page.is_file(), "Missing static/index.html"

          html = page.read_text(encoding="utf-8")

          required = [
              'id="overview"',
              'id="forecast"',
              'id="forecastChart"',
              'id="model"',
              'id="data"'
          ]

          for item in required:
              assert item in html, f"Missing frontend element: {item}"

          print("Website frontend: VALID")
          PY

      # 7. Thông báo kết quả
      - name: CI completed
        run: echo "All HanoiWeather CI checks passed!"
